# Builds the Linux `gallium` binary and packages it with the TOML configs into a
# tarball artifact. Runs on demand and on version tags, like the macOS and
# Windows builds.
#
# This is a CPU-only build on purpose, for the same reason as the Windows one:
# GitHub runners have no GPU, and a CPU artifact runs anywhere. CUDA and Vulkan
# stay opt-in local builds (`--features cuda` / `vulkan`).
#
# Beyond the artifact, this is the build `../klein-cli` consumes: its
# app-server integration test needs a real `gallium` at `$GALLIUM_BIN`, and
# skips without one. See the release step at the bottom for how it gets there.
name: Build Linux

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build-linux:
    # ubuntu-latest, so the binary is linked against that image's glibc and runs
    # on it or newer. That is the right target for another project's CI, which
    # is the point of this artifact; it is also why it will not run on an older
    # distro. rs-gallium#46 was this exact mismatch inside a Dockerfile — a
    # trixie-built binary against an ubuntu 24.04 runtime — and it presents as a
    # binary that refuses to start rather than as a build failure.
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # The runner image already carries build-essential, pkg-config, libssl-dev
      # and git. These two are the ones worth naming, because their absence is
      # what broke the containerized build in #21 and the error arrives minutes
      # into the llama.cpp compile rather than up front:
      #   cmake        — llama-cpp-sys-2 builds llama.cpp through it
      #   libclang-dev — the same crate generates its bindings with bindgen
      # apt is a no-op when the image already has them, so this costs seconds
      # and documents the dependency.
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake libclang-dev

      # Echoed rather than assumed, as in the macOS job: a missing tool named
      # here is far clearer than the compile error it would otherwise cause.
      - name: Show toolchain
        run: |
          rustc -vV
          cmake --version
          clang --version
          ldd --version | head -1

      - name: Cache cargo + build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-cargo-

      - name: Build (release)
        run: cargo build --release --locked

      # Cheap proof the artifact is not merely a file of the right name: a
      # binary missing a shared library builds fine and fails on first run,
      # which is exactly the failure mode #46 shipped.
      - name: Smoke test
        run: |
          set -euo pipefail
          ldd target/release/gallium | grep -i "not found" && exit 1
          echo '{"steps":[{"text":"ok"}]}' > /tmp/smoke.json
          printf 'hi\n/quit\n' | \
            INFERENCE_ENGINE=scripted MODEL_PATH=/tmp/smoke.json \
            ./target/release/gallium | grep -q "Assistant: ok"
          echo "the binary runs and completes a turn"

      - name: Stage package
        run: |
          set -euo pipefail
          stage="dist/gallium-linux-x64"
          mkdir -p "$stage"
          cp target/release/gallium "$stage/"
          cp -R configs "$stage/configs"
          cp README.md LICENSE "$stage/"
          ls -lR "$stage"

      # A tarball rather than a zip, for the reason the macOS job records:
      # `upload-artifact` re-zips what it is handed and drops the executable
      # bit, so a zipped binary arrives needing `chmod +x`. Tar carries its own
      # permissions through the round trip.
      - name: Tar
        run: tar -czf dist/gallium-linux-x64.tar.gz -C dist gallium-linux-x64

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: gallium-linux-x64
          path: dist/gallium-linux-x64.tar.gz
          if-no-files-found: error

  # A workflow artifact is only reachable from this repo's own runs, so it does
  # not solve the problem this build exists for: another project's CI cannot
  # fetch one with its own `GITHUB_TOKEN`. A release asset is a plain URL on a
  # public repo, which anything can `curl`.
  #
  # Tags only. Every push publishing a release would make "latest" mean
  # whatever landed last, which is not something to pin CI to.
  release:
    needs: build-linux
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: gallium-linux-x64
          path: dist

      - name: Attach to the release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/gallium-linux-x64.tar.gz
          # The macOS and Windows jobs attach theirs to the same release, so
          # whichever finishes first creates it and the others append.
          fail_on_unmatched_files: true
