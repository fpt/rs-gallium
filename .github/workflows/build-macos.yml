# Builds the macOS `gallium` binary and packages it with the TOML configs into a
# tarball artifact. Runs on demand and on version tags, like the Windows build.
#
# macOS needs none of the Windows workflow's toolchain coaxing: the `local`
# feature's llama.cpp build wants cmake and a C++ compiler, and the runner image
# ships both along with the Xcode that Metal shader compilation needs. Metal is
# on by default for macOS targets (see crates/gallium-agent/Cargo.toml), so the
# artifact is GPU-capable without a feature flag.
name: Build macOS

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build-macos:
    # macos-latest is Apple Silicon. An Intel artifact would be one more matrix
    # entry (`macos-13`), left out until someone asks: macOS minutes bill at 10x
    # a Linux minute, and this repo's own configs assume the Metal path.
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      # Echoed rather than installed: the image provides all three, and a step
      # that fails here says which one went missing far more clearly than a
      # cmake error three minutes into the llama.cpp build would.
      - name: Show toolchain
        run: |
          rustc -vV
          cmake --version
          xcodebuild -version

      - name: Cache cargo + build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          # Arch is in the key because an Intel entry would otherwise share, and
          # restore, an Apple Silicon `target/`.
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-cargo-

      - name: Build (release)
        run: cargo build --release --locked

      - name: Stage package
        run: |
          set -euo pipefail
          stage="dist/gallium-macos-arm64"
          mkdir -p "$stage"
          cp target/release/gallium "$stage/"
          cp -R configs "$stage/configs"
          cp README.md LICENSE "$stage/"
          ls -lR "$stage"

      # A tarball rather than a zip, unlike the Windows job: `upload-artifact`
      # re-zips whatever it is handed and drops the executable bit on the way,
      # so a zipped binary would arrive needing `chmod +x`. Tar carries its own
      # permissions through the round trip.
      - name: Tar
        run: tar -czf dist/gallium-macos-arm64.tar.gz -C dist gallium-macos-arm64

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: gallium-macos-arm64
          path: dist/gallium-macos-arm64.tar.gz
          if-no-files-found: error

  # A workflow artifact is only reachable from this repo's own runs. A release
  # asset is a plain URL on a public repo, which another project's CI can fetch.
  # Tags only, so "latest" always means a version someone chose to cut. The
  # three platform builds attach to the same release: whichever finishes first
  # creates it and the others append.
  release:
    needs: build-macos
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: gallium-macos-arm64
          path: dist

      - name: Attach to the release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/gallium-macos-arm64.tar.gz
          fail_on_unmatched_files: true
