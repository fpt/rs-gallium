# Local LiquidAI LFM2.5-8B-A1B (in-process llama.cpp, auto-downloaded via hf:).
# Reasoning model: emits <think> blocks, so allow generous maxTokens.
[llm]
modelPath = "hf:LiquidAI/LFM2.5-8B-A1B-GGUF/LFM2.5-8B-A1B-Q4_K_M.gguf"
# The candle backend (INFERENCE_ENGINE=candle) needs a tokenizer.json, and the
# GGUF repo above does not carry one — without this it 404s at startup. Point it
# at the base repo instead. llama.cpp ignores this: it uses the tokenizer inside
# the GGUF.
tokenizerPath = "hf:LiquidAI/LFM2.5-8B-A1B"
temperature = 0.3
maxTokens = 2048

[agent]
maxTurns = 50
