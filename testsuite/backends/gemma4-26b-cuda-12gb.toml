# Same model as gemma4-26b.toml — see that file for the general notes. This is
# the CUDA variant, tuned for a 12GB card: at full offload (999 layers, the
# default) the 14.3GB model fails to *load* rather than decode, since
# llama.cpp's CUDA allocator can't reserve the buffers up front.
#
# CORRECTION: this file previously recorded 18, bisected by watching
# individual runs generate successfully — including with the projector below
# loaded (it's on the GPU too, following the model's offload decision, so it
# eats into the same headroom). That number was **not stable**: it and lower
# values (14, 12) that had passed repeatedly started failing at context
# creation on later, identical repeat runs, with `nvidia-smi` back at idle
# between every attempt and no dmesg/XID errors. llama.cpp's CUDA buffer-size
# reservation is close enough to the card's limit here that ordinary
# allocator variance decides it near the edge, not a number this repo can
# hand you with confidence. See issue #92, filed about exactly this.
#
# 12 is what actually held across repeated full generations (4/4 text, 3/3
# with the projector loaded and an image attached). Treat it as a margin
# below a moving edge, not the tightest value that once passed — room
# probably remains unclaimed above 12. Re-bisect at your own risk, and verify
# with *repeated* full generations, not a single load-then-generate. A
# different card needs its own number — GALLIUM_GPU_LAYERS still overrides
# this file for that search.
[llm]
modelPath = "hf:unsloth/gemma-4-26B-A4B-it-qat-GGUF/gemma-4-26B-A4B-it-qat-UD-Q4_K_XL.gguf"
mmprojPath = "hf:unsloth/gemma-4-26B-A4B-it-qat-GGUF/mmproj-BF16.gguf"
gpuLayers = 12
temperature = 0.3
# The 26B emits a thought channel before answering; the budget must cover
# BOTH (384 truncated a final answer mid-word).
maxTokens = 1024

[agent]
maxTurns = 50
