# Same model as gemma4-26b.toml — see that file for the general notes. This is
# the CUDA variant, tuned for a 12GB card: at full offload (999 layers, the
# default) the 14.3GB model fails to *load* rather than decode, since
# llama.cpp's CUDA allocator can't reserve the buffers up front.
#
# 18 is the highest layer count that completes a full round trip (load,
# create the context, generate) on a 12GB RTX 4070 *with the projector below*
# — the mmproj is loaded onto the GPU too (it follows the model's offload
# decision), so it eats into the same headroom the KV cache and compute
# buffers need. Text-only, without a projector configured, this card can go
# to 22; loading the projector alone drops the ceiling to 18 even though the
# text prompt here didn't grow. 23+ (text-only) / 20+ (with projector) load
# the weights fine but fail at context creation, so search by actually
# generating a token — image or text — not by watching the model load. A
# different card needs its own number — GALLIUM_GPU_LAYERS still overrides
# this file for that search.
[llm]
modelPath = "hf:unsloth/gemma-4-26B-A4B-it-qat-GGUF/gemma-4-26B-A4B-it-qat-UD-Q4_K_XL.gguf"
mmprojPath = "hf:unsloth/gemma-4-26B-A4B-it-qat-GGUF/mmproj-BF16.gguf"
gpuLayers = 18
temperature = 0.3
# The 26B emits a thought channel before answering; the budget must cover
# BOTH (384 truncated a final answer mid-word).
maxTokens = 1024

[agent]
maxTurns = 50
