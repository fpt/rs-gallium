# Same model as gemma4-26b.toml — see that file for the general notes. This is
# the CUDA variant, tuned for a 12GB card: at full offload (999 layers, the
# default) the 14.3GB model fails to *load* rather than decode, since
# llama.cpp's CUDA allocator can't reserve the buffers up front.
#
# CORRECTION: this file previously recorded 18 (without cpuMoe), bisected by
# watching individual runs generate successfully. That number was **not
# stable** — see issue #92. 12 (without cpuMoe) is what actually held across
# repeated full generations.
#
# With cpuMoe = true (MoE experts on CPU RAM, see docs/LLAMA_CPU_MOE.md):
# gpuLayers = 20 held across repeated full generations against the heavier
# real agent config (configs/gemma4-26b-cuda-12gb.toml, system prompt +
# skills + maxTokens=4096) — carried over here since this file's lighter
# prompt (maxTokens=1024, no system prompt) has strictly more headroom, not
# less. Not independently re-bisected for this lighter config, so there may
# be room above 20 here specifically. Re-bisect at your own risk, and verify
# with *repeated* full generations, not a single load-then-generate. A
# different card needs its own number — GALLIUM_GPU_LAYERS/GALLIUM_CPU_MOE
# still override this file for that search.
[llm]
modelPath = "hf:unsloth/gemma-4-26B-A4B-it-qat-GGUF/gemma-4-26B-A4B-it-qat-UD-Q4_K_XL.gguf"
mmprojPath = "hf:unsloth/gemma-4-26B-A4B-it-qat-GGUF/mmproj-BF16.gguf"
cpuMoe = true
gpuLayers = 20
temperature = 0.3
# The 26B emits a thought channel before answering; the budget must cover
# BOTH (384 truncated a final answer mid-word).
maxTokens = 1024

[agent]
maxTurns = 50
