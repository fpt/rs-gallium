# Local Gemma 4 31B dense — every parameter active per token, unlike the
# 26B-A4B MoE in gemma4-26b.toml (26B total, ~4B active). Same family, same
# prompt format. QAT release; ships exactly one GGUF, UD-Q4_K_XL.
# gallium needs a tokenizer.json, which this GGUF repo omits — set
# GALLIUM_TOKENIZER_REPO=unsloth/gemma-4-31B-it (or tokenizerPath below).
# On llama.cpp+Metal/CUDA the 17.3GB model may exceed the GPU working set; cap
# with GALLIUM_GPU_LAYERS/gpuLayers (or 0 for CPU) — see
# gemma4-31b-cuda-12gb.toml for a value already tuned to a 12GB card.
[llm]
modelPath = "hf:unsloth/gemma-4-31B-it-qat-GGUF/gemma-4-31B-it-qat-UD-Q4_K_XL.gguf"
tokenizerPath = "hf:unsloth/gemma-4-31B-it"
temperature = 0.3
# The 26B emits a thought channel before answering; the budget must cover
# BOTH (384 truncated a final answer mid-word). Same family template, so kept
# in step with gemma4-26b.toml/gemma4-12b.toml.
maxTokens = 1024

[agent]
maxTurns = 50
