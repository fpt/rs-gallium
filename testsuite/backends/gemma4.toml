# Local Gemma 4 E4B (in-process llama.cpp)
# hf: spec auto-downloads into the HF cache — cross-platform (macOS + Windows).
[llm]
modelPath = "hf:unsloth/gemma-4-E4B-it-GGUF/gemma-4-E4B-it-Q4_K_M.gguf"
# Vision + audio. E4B uses *dedicated* encoders (16 vision blocks, 12 audio
# blocks, 478M params), so its projector is a 946 MB download — larger than the
# 12B's, which is encoder-free and ships only linear layers.
mmprojPath = "hf:unsloth/gemma-4-E4B-it-GGUF/mmproj-BF16.gguf"
temperature = 0.3
maxTokens = 2048

[agent]
maxTurns = 50
