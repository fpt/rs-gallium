# Same model as configs/minimax-m2.toml — see that file for the general
# notes. This is the CUDA variant, tuned for a 12GB card.
#
# With cpuMoe = true (MoE experts on CPU RAM, see docs/LLAMA_CPU_MOE.md):
# full offload (999, the default — no gpuLayers line needed) held across
# repeated full generations, both the light `capital` testcase (6/6) and the
# multi-turn tool-calling `file_read` testcase, with ~6.5GB of the 12GB card
# still free (5.3GB used) — comfortably clear of the VRAM-edge fragility
# issue #92 describes for Qwen 3.6/Gemma 4 before cpuMoe. Verified per that
# issue's discipline (repeated real generations, not a single
# load-then-generate check). A different card needs its own number —
# GALLIUM_GPU_LAYERS/GALLIUM_CPU_MOE still override this file.
[llm]
modelPath = "hf:unsloth/MiniMax-M2.7-GGUF/UD-Q2_K_XL/MiniMax-M2.7-UD-Q2_K_XL-00001-of-00003.gguf"
cpuMoe = true
temperature = 0.3
# MiniMax-M2.7 reasons before answering (its template pre-fills `<think>\n`
# into the *prompt*, so only the closing tag appears in generated text —
# strip_think_blocks in llm_local.rs doesn't strip it, since it requires a
# literal opening tag in the completion). 1024 covers that plus a real
# answer; not related to the `refactoring` testcase failure below.
maxTokens = 1024

[agent]
maxTurns = 50

# Full-matrix result (BACKENDS=minimax-m2-cuda-12gb bash testsuite/matrix_runner.sh):
# 6/9 PASS. multimodal_audio/multimodal_image FAIL as expected — no
# mmprojPath, this model is text-only (same class of failure as gpt-oss/lfm2
# in README.md's multimodal table).
#
# refactoring FAILs for a real reason, not a tuning one: this GGUF's chat
# template defines a *native* tool-call protocol —
# `<minimax:tool_call><invoke name="...">​<parameter name="...">value</parameter></invoke></minimax:tool_call>` —
# confirmed by reading `tokenizer.chat_template` straight out of the GGUF.
# llm_local.rs only renders a model's native tool protocol when
# `template_supports_native_tools()` recognizes it (currently Gemma-4-only,
# see build_prompt/render_native); every other model, this one included,
# gets a generic hand-written "respond with this JSON shape" instruction it
# was never fine-tuned against. Simple one-arg calls (the `Read` in this
# same run) come out fine by luck; the nested-array `MultiEdit` call came
# back as almost-valid JSON missing one closing brace, which gallium
# correctly refused to parse as a tool call — so it fell through to raw
# text. Not a `gpuLayers`/`cpuMoe`/`maxTokens` issue; fixing it means
# teaching llm_local.rs to detect and render the `<minimax:tool_call>`
# protocol (and parse it back out of completions), the same shape of work
# `render_native`/`parse_gemma_calls` already do for Gemma 4.
