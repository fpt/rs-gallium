# Same model as qwen3.6.toml — see that file for the general notes. This is
# the CUDA variant, tuned for a 12GB card. Without cpuMoe: at full offload
# (999, the default) the 16.8GB model fails to *load*; gpuLayers = 26 held
# across repeated full generations (5/5, twice), 28-30 was an unstable edge
# (see issue #92). With cpuMoe = true (MoE experts on CPU RAM, see
# docs/LLAMA_CPU_MOE.md): full offload just works, verified 5/5 repeats — no
# gpuLayers bisection needed for this model. A different card needs its own
# number — search with GALLIUM_GPU_LAYERS/GALLIUM_CPU_MOE (both still
# override this file) with *repeated* full generations, not a single
# load-then-generate check.
#
# KNOWN ISSUE (#98): a real multi-turn ReAct conversation with this model can
# hit `Decode Error -1: n_tokens == 0` on the second iteration — a
# KV-cache-reuse bug, unrelated to gpuLayers/cpuMoe. Workaround until fixed:
# GALLIUM_KV_CACHE_SLOTS=0.
[llm]
modelPath = "hf:unsloth/Qwen3.6-35B-A3B-GGUF/Qwen3.6-35B-A3B-UD-Q3_K_XL.gguf"
cpuMoe = true
temperature = 0.7
maxTokens = 4096

[agent]
maxTurns = 50
