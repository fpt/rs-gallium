[llm]
# Same model as qwen3.6.toml — see that file for the general notes. This is
# the CUDA variant, tuned for a 12GB card.
#
# Without cpuMoe: at the default full offload (999 layers) the 16.8GB model
# fails to *load* rather than decode, since llama.cpp's CUDA allocator can't
# reserve the buffers up front; gpuLayers = 26 was the highest layer count
# that held across repeated full generations (5/5, twice) against this
# file's real prompt (system prompt + skills + maxTokens=4096). The bisected
# edge was 28-30 (30 failed at context creation outright; 28 loaded and
# mostly generated, but 1 of 5 repeat runs stalled/never completed) — an
# unstable edge, not a safe value; see issue #92 for why a single
# load-then-generate pass can't be trusted that close to the limit.
#
# With cpuMoe = true (MoE experts on CPU RAM, attention + KV cache stay on
# GPU — see docs/LLAMA_CPU_MOE.md): **full offload (999, the default) just
# works**, verified 5/5 repeated generations against this same real prompt.
# This model's non-expert weights are small enough relative to the card that
# moving the (256-expert) MoE tensors off GPU entirely removes the
# bottleneck outright — not true for every model (Gemma 4 26B-A4B still
# needs gpuLayers bisection even with cpuMoe, see gemma4-26b-cuda-12gb.toml),
# so verify per model rather than assume.
#
# KNOWN ISSUE (#98): a real multi-turn ReAct conversation with this model
# (e.g. one tool call followed by an answer) can hit
# `Decode Error -1: n_tokens == 0` on the second iteration — a KV-cache-reuse
# bug, unrelated to gpuLayers/cpuMoe (reproduces with either on or off).
# Workaround until fixed: `GALLIUM_KV_CACHE_SLOTS=0` (disables reuse, so
# every iteration re-evaluates the whole prompt — slower, not incorrect).
#
# A different card, `maxTokens`, or system prompt needs its own number for
# gpuLayers — GALLIUM_GPU_LAYERS still overrides this file for that search,
# verified with *repeated* full generations, not a single one. Do not copy
# these settings back into qwen3.6.toml: that file is shared by every
# backend, including Metal on Mac, where a card with more memory than 12GB
# would be capped for no reason.
modelPath = "hf:unsloth/Qwen3.6-35B-A3B-GGUF/Qwen3.6-35B-A3B-UD-Q3_K_XL.gguf"
cpuMoe = true
temperature = 0.7
maxTokens = 4096

[agent]
systemPromptPath = "system-prompt.md"   # Path to system prompt file (relative to config dir)
maxTurns = 50
skillPaths = ["../skills"]              # SKILL.md dirs (relative to this config's dir)
