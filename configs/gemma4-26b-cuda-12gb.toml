[llm]
# Same model as gemma4-26b.toml — see that file for the general notes. This is
# the CUDA variant, tuned for a 12GB card specifically: at the default full
# offload (999 layers) the 14.3GB model fails to *load* rather than decode,
# since llama.cpp's CUDA allocator can't reserve the buffers up front.
#
# The safe layer count is *not* just a function of the model and the card: the
# context llama.cpp actually allocates is `n_ctx.max(n_prompt + max_tokens)`
# (see CLAUDE.md's KV cache reuse notes), so a bigger `maxTokens` or a longer
# prompt (this file's system prompt + skill catalog + tool schemas) needs more
# VRAM for the same weights and the same GPU layers — and the mmproj below
# adds its own draw on top, since it's loaded onto the GPU too (it follows the
# model's offload decision).
#
# CORRECTION: this file previously recorded 18, bisected by watching
# individual runs generate successfully. That number was **not stable**: it
# and lower values (14, 12) that had passed repeatedly started failing at
# context creation on later, identical repeat runs, with `nvidia-smi` back at
# idle between every attempt and no dmesg/XID errors — llama.cpp's CUDA
# buffer-size reservation is close enough to the card's limit here that
# ordinary allocator variance decides it, not a number this repo can hand you
# with confidence at the edge. See issue #92, filed about exactly this: a
# hand-bisected number is fundamentally fragile near the limit.
#
# 12 (without cpuMoe) is what actually held across repeated full generations
# (4/4 text, 3/3 with the projector loaded and an image attached). Treat it
# as a margin below a moving edge, not the tightest value that once passed.
#
# With cpuMoe = true (MoE experts on CPU RAM, attention + KV cache stay on
# GPU — see docs/LLAMA_CPU_MOE.md): gpuLayers = 20 held across repeated full
# generations (5/5), a real improvement over 12 but — unlike MiniMax-M2.7
# (minimax-m2.toml), where full offload (999, the default) holds on this
# same 12GB card with ~6.5GB still free — still well short of full offload
# (22+ failed at context creation even with cpuMoe). This model's
# non-expert weights (plus
# the projector above, which is loaded onto the GPU too) are apparently
# still large enough relative to the card to need bisection either way.
#
# Re-bisect at your own risk, and verify with *repeated* full generations,
# not a single load-then-generate — see issue #92 for why a hand-bisected
# number is fragile near the limit even done carefully. A different card,
# `maxTokens`, or system prompt needs its own number — GALLIUM_GPU_LAYERS /
# GALLIUM_CPU_MOE still override this file for that search.
#
# Do not copy these settings back into gemma4-26b.toml: that file is shared
# by every backend, including Metal on Mac, where a card with more memory
# than 12GB would be capped for no reason.
modelPath = "hf:unsloth/gemma-4-26B-A4B-it-qat-GGUF/gemma-4-26B-A4B-it-qat-UD-Q4_K_XL.gguf"
mmprojPath = "hf:unsloth/gemma-4-26B-A4B-it-qat-GGUF/mmproj-BF16.gguf"
cpuMoe = true
gpuLayers = 20
temperature = 0.7
maxTokens = 4096
# reasoningEffort = "medium" (→ `enable_thinking = true`) — the 26B-A4B MoE
# uses Gemma 4's thought channel to plan a multi-step task; without it, on
# 2026-08-29 (this config, leak fix in tree) `data_analysis` looped to
# `max_iterations` and failed 0/6 gates while `refactoring` diverged, and with
# it both pass — `data_analysis` 6/6 in 8 ReAct calls, `refactoring` in 4. This
# is **not** a Gemma-4-family default: on the dense E4B (`gemma4.toml`) the same
# flag makes `data_analysis` slightly *worse* (1/6 vs 2/6) and buys nothing, so
# it stays off there. The 12B (`gemma4-12b.toml`) is untested. See
# docs/VERIFICATION_STATUS.md.
reasoningEffort = "medium"

[agent]
# Gemma 4 does support a system role, and its template declares tools natively
# (`<|tool>` / `<|tool_call>`), which llm_local.rs renders and parses. See
# docs/GEMMA4.md.
#
# Gemma 4 is capable but not self-directed: with the shared prompt it answers
# "tell me the status of this repo" by asking which repository is meant. This
# prompt tells it where it is and to look before asking. See the file's header.
systemPromptPath = "gemma4-system-prompt.md"
maxTurns = 50
skillPaths = ["../skills"]              # SKILL.md dirs (relative to this config's dir)

[[mcpServers]]
command = "godevmcp"
args = ["serve"]
