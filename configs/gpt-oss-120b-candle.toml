# GPT-OSS 120B on the **native candle engine** — the counterpart of
# `gpt-oss-120b.toml`, which runs the same model through in-process llama.cpp.
# The pair is the point: a difference between the two is a difference between the
# engines, not between models. See `gemma4-candle.toml` / `lfm2-candle.toml` for
# the same idea on smaller models.
#
# **This points at the safetensors repo, not a GGUF — though a GGUF now works
# too.** `gallium_core::load_gguf` merges a split GGUF (llama.cpp's `gguf-split`
# convention, `-00001-of-00002.gguf` + `-00002-of-00002.gguf`) transparently as
# of docs/CANDLE_BACKEND.md's "Remaining work" §7, so `gpt-oss-120b-Q4_K_M`
# loads through `gpt_oss_q.rs` the same way the 20B GGUF config does — verified
# end to end (`gallium-models/tests/integration.rs::gpt_oss_120b_gguf_split`,
# CPU, `unsloth/gpt-oss-120b-GGUF`, correct "Paris" answer in 39s for 80
# tokens). This config still points at safetensors: it was the first path
# verified for 120B and nothing here has been re-measured against the GGUF
# for a full agent turn. The candle engine loads GPT-OSS 120B from
# `openai/gpt-oss-120b` (MXFP4, 14 safetensors shards, ~63 GB, not gated).
# `gpt_oss.rs` opens a second U8 `VarBuilder` over the same shards for the MXFP4
# block tensors and dequantizes each expert inside `forward`.
#
# GALLIUM_TOKENIZER_REPO is not needed here (the safetensors repo ships
# tokenizer.json), unlike the llama.cpp GGUF config.
#
# **Device.** This does not fit a 12 GB card: the non-expert weights alone
# (F16, ~10 GB) plus embeddings plus KV exceed it, and candle has no `cpuMoe`
# equivalent — the whole model goes on `GALLIUM_DEVICE`. On a 128 GB-RAM host
# `GALLIUM_DEVICE=cpu` runs (MXFP4 experts stay quantized until a token routes
# to them), but slowly: candle dequantizes each active expert's weights inside
# `forward`, once per token (docs/CANDLE_BACKEND.md item 6), and at 120 B that
# is a lot of experts. Budget minutes per testcase, not seconds.
#
# temperature = 1.0, topP = 1.0 — openai/gpt-oss's own recommended sampling,
# matching `gpt-oss-120b.toml`.
[llm]
inferenceEngine = "candle"
modelPath = "hf:openai/gpt-oss-120b"
temperature = 1.0
topP = 1.0
maxTokens = 4096

[agent]
maxTurns = 50
