# GPT-OSS 120B on the **native candle engine** — the counterpart of
# `gpt-oss-120b.toml`, which runs the same model through in-process llama.cpp.
# The pair is the point: a difference between the two is a difference between the
# engines, not between models. See `gemma4-candle.toml` / `lfm2-candle.toml` for
# the same idea on smaller models.
#
# **GGUF now, not safetensors.** `gallium_core::load_gguf` merges a split GGUF
# (llama.cpp's `gguf-split` convention, `-00001-of-00002.gguf` +
# `-00002-of-00002.gguf`) transparently since #257, so `gpt-oss-120b-Q4_K_M`
# loads through `gpt_oss_q.rs` the same way the 20B GGUF config does. Verified
# for a full local testsuite run, not just the split-load + one-prompt check
# `gallium-models/tests/integration.rs::gpt_oss_120b_gguf_split` already
# covers — see docs/VERIFICATION_STATUS.md ("GPT-OSS 120B on candle"). Also
# picks up #261's token_embd row-gather and #265's fused MXFP4 decode matvec
# (both shared code with the 20B config).
# `openai/gpt-oss-120b` (safetensors, `gpt_oss.rs`) still works too, if you'd
# rather not touch the GGUF cache — the two paths are otherwise equivalent.
#
# tokenizerPath: this GGUF repo omits tokenizer.json (llama.cpp uses the one
# embedded in the GGUF); `openai/gpt-oss-120b` ships one. `GALLIUM_TOKENIZER_REPO`
# still overrides.
#
# **Device.** The GGUF path keeps the MXFP4 experts in the file mmap and only
# touches the ones a token routes to, so the *non-expert* weights + KV are all
# that need to be resident — ~4.3 GiB, well within a 12 GB card, on either
# `GALLIUM_DEVICE=cpu` (large-RAM host) or `=cuda`.
#
# cpuMoe: run those experts on the CPU. candle has no MXFP4 kernel, so on CUDA
# each active expert is otherwise re-uploaded and dequantized to the GPU per
# token — measured on a 12 GB 4070, `cpuMoe` took the `coding` testcase from
# 556 s to 108 s (5.1x) and dropped peak VRAM ~0.9 GB. CUDA only for now
# (inert on GALLIUM_DEVICE=cpu, and on Metal until verified there).
# See docs/LLAMA_CPU_MOE.md ("On the candle backend").
#
# temperature = 1.0, topP = 1.0 — openai/gpt-oss's own recommended sampling,
# matching `gpt-oss-120b.toml`.
[llm]
inferenceEngine = "candle"
modelPath = "hf:unsloth/gpt-oss-120b-GGUF/Q4_K_M/gpt-oss-120b-Q4_K_M-00001-of-00002.gguf"
tokenizerPath = "hf:openai/gpt-oss-120b"
cpuMoe = true
temperature = 1.0
topP = 1.0
maxTokens = 4096

[agent]
maxTurns = 50
