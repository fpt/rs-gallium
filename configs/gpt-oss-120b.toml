# Local GPT-OSS 120B (in-process llama.cpp, Harmony template). 117B total,
# 5.1B active (MoE). hf: spec auto-downloads into the HF cache. The GGUF
# repo omits tokenizer.json, which the native gallium backend needs — set
# GALLIUM_TOKENIZER_REPO=openai/gpt-oss-120b when running INFERENCE_ENGINE=candle.
#
# Q4_K_M is a 2-shard split (49.6GB + 13.1GB, 62.8GB total) — modelPath names
# shard 1 only; model_downloader.rs detects the `-NNNNN-of-MMMMM.gguf`
# convention from the filename and fetches every sibling shard automatically
# (see docs, model_downloader.rs's module comment).
#
# cpuMoe = true (MoE experts on CPU RAM, attention + KV cache stay on GPU —
# see docs/LLAMA_CPU_MOE.md): not yet verified on a specific card for this
# model. Given the file is dominated by expert weights (most of 117B total
# vs 5.1B active), this is likely to help a lot, the same shape as
# Gemma 4/MiniMax-M2.7/DeepSeek-V4-Flash — but "likely" isn't "verified"; bisect
# gpuLayers with *repeated* real generations before trusting a number here
# (issue #92).
#
# temperature = 1.0, topP = 1.0 — openai/gpt-oss's own recommended sampling
# (https://github.com/openai/gpt-oss: "We recommend sampling with
# temperature=1.0 and top_p=1.0"), replacing this repo's previous
# temperature=0.3 guess. Verified via `testsuite/runner.sh` against the 7
# non-multimodal testcases (no mmprojPath — GPT-OSS has no vision/audio
# support): 7/7 pass at both settings, no regressions. `refactoring`, the
# most iteration-heavy case, was repeated 3× at each setting — 6/6/6 model
# calls at the old temperature=0.3 (consistent, as expected near-greedy),
# 5/7/7 at temperature=1.0/topP=1.0 (more call-count variance, as expected
# at higher temperature) — but PASS all 6 times, no failures either
# setting. topP=1.0 is a no-op today (gallium's topP sampler stage is
# skipped when unset, which is already unbounded), included anyway so the
# config states the full upstream-recommended pair explicitly rather than
# relying on an absence to mean the same thing.
[llm]
modelPath = "hf:unsloth/gpt-oss-120b-GGUF/Q4_K_M/gpt-oss-120b-Q4_K_M-00001-of-00002.gguf"
cpuMoe = true
temperature = 1.0
topP = 1.0
maxTokens = 4096

[agent]
maxTurns = 50
