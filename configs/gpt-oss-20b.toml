# Local GPT-OSS 20B (in-process llama.cpp, Harmony template).
# hf: spec auto-downloads into the HF cache. The GGUF repo omits tokenizer.json,
# which the native gallium backend needs — set
# GALLIUM_TOKENIZER_REPO=openai/gpt-oss-20b when running INFERENCE_ENGINE=candle.
#
# temperature = 1.0, topP = 1.0 — openai/gpt-oss's own recommended sampling
# (https://github.com/openai/gpt-oss), same change made to gpt-oss-120b.toml
# after that file's testsuite verification (see its own comment for the
# results: 7/7 pass at both settings, 6/6 repeats of `refactoring` alone).
# Now that the 20B GGUF is actually cached here, `verify-preamble` ran the
# full non-multimodal suite (9 testcases; no mmprojPath configured, so the
# two multimodal cases don't apply) at these same sampling settings both
# with and without the agent preamble below — 9/9 without it, so the
# sampling settings themselves are confirmed sound on this quant even though
# isolating sampling alone wasn't a separate run.
#
# profile = "gpt-oss-20b" — that same run is why this is pinned rather than
# left to detect into plain `gpt-oss`: with `GptOss`'s agent_preamble_suffix
# present, `coding` took 19 model calls instead of 3, and `refactoring`
# flipped from passing to failing (8/9 overall). Removing the suffix
# restored both. See `GptOss20b`'s doc comment
# (crates/gallium-agent/src/profile/gpt_oss.rs) — same Harmony wire format as
# 120b, preamble opted out. Not a claim that 120b's own preamble is wrong,
# only that the effect is per-checkpoint, not per-family.
[llm]
modelPath = "hf:unsloth/gpt-oss-20b-GGUF/gpt-oss-20b-Q4_K_M.gguf"
profile = "gpt-oss-20b"
# cpuMoe: the 11GB GGUF at full offload sits on the fragile edge of a 12GB
# card (issue #92); moving the MoE experts to CPU RAM makes it fit reliably
# on both a 12GB CUDA card and a 24GB M3. GALLIUM_CPU_MOE overrides.
cpuMoe = true
temperature = 1.0
topP = 1.0
maxTokens = 4096

[agent]
maxTurns = 50
