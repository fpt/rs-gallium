[llm]
# Gemma 4 12B (dense), tuned for a 12GB CUDA card (also runs on a 24GB M3). Encoder-free projector
# (167 MB) does vision + inexact audio. Tuning and measurements:
# docs/VERIFICATION_STATUS.md ("Gemma 4 12B").
#
# gpuLayers 24: full offload fails at context creation on a 12GB card
#   ("null reference from llama.cpp"); 24 holds with ~3GB headroom.
# reasoningEffort "medium": this dense 12B uses Gemma 4's thought channel to
#   plan multi-step work — flips two testcase failures, breaks nothing.
modelPath = "hf:unsloth/gemma-4-12B-it-qat-GGUF/gemma-4-12B-it-qat-UD-Q4_K_XL.gguf"
mmprojPath = "hf:unsloth/gemma-4-12B-it-qat-GGUF/mmproj-BF16.gguf"
tokenizerPath = "hf:unsloth/gemma-4-12b-it"
gpuLayers = 24
temperature = 0.7
maxTokens = 4096
reasoningEffort = "medium"

[agent]
systemPromptPath = "gemma4-system-prompt.md"
maxTurns = 50
skillPaths = ["../skills"]
