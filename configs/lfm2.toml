# Local LiquidAI LFM2.5-8B-A1B (in-process llama.cpp).
# The `hf:` modelPath is auto-downloaded into the HuggingFace cache
# (~/.cache/huggingface/hub) on first use — transactional + resumable.
# Format: hf:ORG/REPO[@REVISION]/path/to/file.gguf
[llm]
modelPath = "hf:LiquidAI/LFM2.5-8B-A1B-GGUF/LFM2.5-8B-A1B-Q4_K_M.gguf"
# Local backend: "llamacpp" (default) or "candle" (the native engine). It
# supports LFM2.5's hybrid short-conv + GQA MoE architecture. candle
# needs a tokenizer.json, which this GGUF repo omits, so also set
#   GALLIUM_TOKENIZER_REPO=LiquidAI/LFM2.5-8B-A1B
# inferenceEngine = "candle"
# Greedy, deliberately. Measured on the `refactoring` testcase: at 0.3 this
# model wrote a file that did not compile in 3 of 5 candle runs — a dropped
# `import`, a duplicated `func main()`, once a "refactor" in Java syntax — while
# greedy writes the correct file on both engines. A tool call and the code inside
# it are not a place for sampling diversity, and greedy makes a testsuite run
# reproducible rather than a coin flip. See docs/VERIFICATION_STATUS.md.
temperature = 0.0
# LFM2.5 is a reasoning model: it emits a <think> block before the answer, so
# the budget must cover BOTH. 512 was too low — long deliberation got truncated
# mid-think, leaving no answer to print/speak.
maxTokens = 4096

[agent]
systemPromptPath = "system-prompt.md"   # Path to system prompt file (relative to config dir)
maxTurns = 50
skillPaths = ["../skills"]              # SKILL.md dirs (relative to this config's dir)
