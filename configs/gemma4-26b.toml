[llm]
# `hf:` spec — resolved and downloaded into the HuggingFace cache by the Rust
# model downloader, so this works from every frontend.
#
# 26B-A4B: a mixture-of-experts model — 26B total weights, ~4B active per token.
# This is the QAT (quantization-aware trained) release, which ships exactly one
# model GGUF, UD-Q4_K_XL; there is no Q4_K_M to pick.
#
# 14.3GB on disk, vs 5.0GB for the E4B this replaces. If that does not fit,
# `hf:unsloth/gemma-4-E4B-it-GGUF/gemma-4-E4B-it-Q4_K_M.gguf` is the smaller
# sibling and speaks the identical prompt format (docs/GEMMA4.md).
modelPath = "hf:unsloth/gemma-4-26B-A4B-it-qat-GGUF/gemma-4-26B-A4B-it-qat-UD-Q4_K_XL.gguf"
# Local backend: "llamacpp" (default) or "candle" (the native engine, which
# supports this MoE variant). candle needs a tokenizer.json, which this GGUF repo
# omits, so also set GALLIUM_TOKENIZER_REPO=unsloth/gemma-4-26B-A4B-it.
# NOTE llama.cpp+Metal/CUDA: 14.3GB exceeds some GPUs' working set at full
# offload (999 layers, the default) — cap it with GALLIUM_GPU_LAYERS or this
# file's `gpuLayers`, or see configs/gemma4-26b-cuda-12gb.toml for a value
# already tuned to a 12GB card.
# inferenceEngine = "candle"
temperature = 0.7
maxTokens = 4096

[agent]
# Gemma 4 does support a system role, and its template declares tools natively
# (`<|tool>` / `<|tool_call>`), which llm_local.rs renders and parses. See
# docs/GEMMA4.md.
#
# Gemma 4 is capable but not self-directed: with the shared prompt it answers
# "tell me the status of this repo" by asking which repository is meant. This
# prompt tells it where it is and to look before asking. See the file's header.
systemPromptPath = "gemma4-system-prompt.md"
maxTurns = 50
skillPaths = ["../skills"]              # SKILL.md dirs (relative to this config's dir)

[[mcpServers]]
command = "godevmcp"
args = ["serve"]
