[llm]
# Gemma 4 26B-A4B (MoE, ~4B active), tuned for a 12GB CUDA card (also runs on a 24GB M3). Vision only —
# this checkpoint's projector reports `audio=false` (its card lists text +
# image). Tuning and measurements: docs/VERIFICATION_STATUS.md ("Gemma 4
# 26B-A4B") and docs/LLAMA_CPU_MOE.md.
#
# cpuMoe + gpuLayers 20: the 14.3GB model does not load at full offload on a
#   12GB card; cpuMoe moves the expert tensors to CPU RAM, 20 non-expert
#   layers hold on the GPU (5/5 repeats). Still short of full offload.
# maxCtx 24576: left unset, the ceiling defaults to n_ctx_train (262144) and
#   self-corrects downward on a failed allocation — fine for a ceiling that's
#   slightly wrong, not for a card this far short of the trained window. Worse,
#   a narrow band just above this card's real limit crashes the whole process
#   instead of failing gracefully (see docs/LLAMA_CPU_MOE.md's "maxCtx near the
#   VRAM edge"). 24576 is comfortably below both edges, not bisected to the
#   last safe token.
# reasoningEffort "medium": with thinking off this MoE loops to max_iterations
#   on multi-step tasks; on, it plans them. Flips two testcase failures.
modelPath = "hf:unsloth/gemma-4-26B-A4B-it-qat-GGUF/gemma-4-26B-A4B-it-qat-UD-Q4_K_XL.gguf"
mmprojPath = "hf:unsloth/gemma-4-26B-A4B-it-qat-GGUF/mmproj-BF16.gguf"
cpuMoe = true
gpuLayers = 20
temperature = 0.7
maxTokens = 4096
maxCtx = 24576
reasoningEffort = "medium"

[agent]
systemPromptPath = "gemma4-system-prompt.md"
maxTurns = 50
skillPaths = ["../skills"]

[[mcpServers]]
command = "godevmcp"
args = ["serve"]
