# Gemma 4 26B-A4B (MoE) on the native candle engine. Pairs with gemma4-26b.toml
# (llama.cpp, cpuMoe + gpuLayers 20) the way gemma4-candle.toml pairs with
# gemma4.toml.
#
# Fits the 12GB reference card at ~4.2 GiB: the MoE experts (~12.85 GB of Q4_0,
# 30 layers x 128 experts, 89% of the file) stay mmap-resident and only the
# active experts' rows are touched per forward.
#
# expertCacheBytes (issue #253): a resident LRU of per-expert QMatMuls, so a
# routed-again decode expert (~3.3 MB of Q4_0) is served from VRAM instead of
# re-uploaded from the mmap every token. 4 GiB alongside the ~4.5 GiB base peaks
# ~8.5 GiB on the 12 GB card and took `refactoring` 32s -> 20s, `spec_discovery`
# 30s -> 22s. CUDA only: inert on CPU, and refused with a warning on Metal, where
# it measured as a 0.5x decode loss (unified memory). See docs/VERIFICATION_STATUS.md.
#
# mmprojPath: this repo's projector is the dedicated-encoder style (like
# E4B's), not 12B's encoder-free "unified" one, so the candle tower loader
# already covers it — it just needed the `v.std_bias`/`v.std_scale` QAT
# recalibration affine this mmproj carries and E4B/12B's don't
# (`Gemma4Multimodal::std_bias`, gemma4_vision.rs).
[llm]
inferenceEngine = "candle"
modelPath = "hf:unsloth/gemma-4-26B-A4B-it-qat-GGUF/gemma-4-26B-A4B-it-qat-UD-Q4_K_XL.gguf"
mmprojPath = "hf:unsloth/gemma-4-26B-A4B-it-qat-GGUF/mmproj-BF16.gguf"
# candle needs a tokenizer.json; the -qat-GGUF repo omits it.
tokenizerPath = "hf:unsloth/gemma-4-26B-A4B-it"
expertCacheBytes = 4294967296   # 4 GiB
temperature = 0.7
maxTokens = 4096

[agent]
systemPromptPath = "gemma4-system-prompt.md"
maxTurns = 50
skillPaths = ["../skills"]
