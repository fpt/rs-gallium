[llm]
# Qwen3.8-27B (dense, hybrid Gated DeltaNet + full attention, same `qwen35`
# family Qwen 3.6 shares — see qwen35.rs's own file-naming note) — replaces
# this repo's Qwen 3.6 config. GGUF's own `general.architecture` is `qwen35`,
# already registered in this repo's pinned llama.cpp (`LLM_ARCH_QWEN35`) —
# the same architecture Qwen 3.6 already ran on, so text generation needed no
# new support. What's new here is real vision: this is a native
# vision-language model, and its GGUF repo ships a working `mmproj-*.gguf`
# (`clip.projector_type = qwen3vl_merger`, fully wired into this repo's
# pinned llama.cpp's `clip.cpp` — checked directly, not assumed from the
# model card). Confirmed working: reads a two-digit number out of an image
# correctly (`multimodal_image` testcase). Vision only, no audio — the
# projector declares `clip.has_vision_encoder` and no audio-encoder field at
# all, and gallium correctly refuses an audio turn against it
# ("the configured projector is vision-only") rather than answering blind.
#
# UD-Q4_K_XL (17.9GB, this repo's usual quant choice) — full testsuite
# verified 8/8 relevant testcases (`make testsuite BACKENDS="qwen3.8-cuda-12gb"`;
# multimodal_audio doesn't apply, see above): arithmetic, capital, coding,
# file_read, memory_state, multimodal_image, needle_in_haystack, refactoring
# all pass.
#
# `refactoring` used to fail: the model reasoned correctly and wrote correct
# replacement code, but emitted its tool call as
# `{"function": "Edit", "file_path": ..., "new_string": ..., "old_string": ...}`
# — tool name as a flat *string* value under a `"function"` key, arguments as
# sibling keys rather than nested under `"arguments"`, a fourth shape
# `crate::profile::wire::json` doesn't recognize. Fixed not by extending that
# parser but by not needing it: `Qwen3::template_formats_tools_natively` now
# matches this model's own template (it declares a native
# `<tool_call><function=NAME><parameter=K>value</parameter></function>` format,
# confirmed by reading the embedded template directly), so llama.cpp renders
# tools through it instead of asking for JSON prose the model was apparently
# less reliable at producing under this family's own preferred format.
#
# Reasoning: this model's own chat template defaults `reasoning_effort` to
# `"xhigh"` whenever thinking is on (`enable_thinking` itself defaults **on**,
# unlike Qwen 3.6's own template) — a real behavioral difference from 3.6,
# not a gallium setting. `crate::profile::Qwen3::reasoning_params`
# now projects gallium's five-point `reasoningEffort` scale onto this family's
# four states — off, `low`, `medium`, `xhigh` — so an unset `reasoningEffort`
# still runs at the template's own default (`xhigh`), but setting one is no
# longer inert. See that function's own doc for the table, and for why
# gallium's `High` lands on `medium`: the template accepts exactly
# `xhigh`/`medium`/`low` and raises on anything else, and a raise is a silent
# fall back to the JSON-prose tool protocol rather than a visible error.
#
# One thing recorded here previously and now in doubt: that this template
# "silently upgrades `high` to `xhigh`". `Qwen/Qwen3.8-27B/chat_template.jinja`
# does not — it raises, exactly as Flash-Next's (byte-identical) one does.
# Either unsloth's GGUF embeds a patched template or that note was wrong.
# Re-extract it on the CUDA box to settle it:
#   uv run python scripts/extract_chat_template.py <the GGUF> \
#     > crates/gallium-agent/tests/fixtures/chat_templates/qwen3.8.jinja
# The clamp makes the answer moot for correctness — nothing that could raise
# reaches the template either way — but the fixture should be the bytes this
# model actually carries.
#
# temperature = 1.0, topP = 0.95, topK = 20 -- this model card's own
# recommended "Thinking Mode" sampling, which is what applies here since
# enable_thinking defaults on (see the reasoning-effort note above) and
# reasoningEffort is unset in this config. The card's other two knobs,
# min_p and presence_penalty, have no gallium sampler stage yet (only
# temperature/topP/topK are wired -- see LlmConfig in config.rs), so this
# is a partial match, not the full recommended set. Motivated by a klein
# report of malformed tool-call JSON deep in a ReAct loop (a <tool_call>
# block left unclosed, trailing into a duplicated <tool_call>/</function>
# -- a blend of the JSON-prose shape gallium asks for and this model's own
# native XML tool format) under the previous unspecified-topP/topK,
# temperature=0.7 setting. Re-verified against the full local testsuite
# with this pair (`make testsuite BACKENDS="qwen3.8-cuda-12gb"`): 7/9 at
# the time (`refactoring` was still its own separate known-shape gap then,
# since fixed -- see above; `multimodal_audio` -- no audio encoder --
# doesn't apply and still doesn't) and no malformed tool-call output
# observed on any of the other seven, including the multi-iteration ones
# (`coding`, `file_read`, `memory_state`, `needle_in_haystack`). Not a
# guarantee against the much deeper (8-iteration, ~17K-token) conversation
# that originally surfaced the malformed output -- no single testcase here
# goes that deep -- but a real, verified improvement over the prior
# unspecified sampling.
modelPath = "hf:unsloth/Qwen3.8-27B-GGUF/Qwen3.8-27B-UD-Q4_K_XL.gguf"
mmprojPath = "hf:unsloth/Qwen3.8-27B-GGUF/mmproj-F16.gguf"
temperature = 1.0
topP = 0.95
topK = 20
maxTokens = 4096

[agent]
systemPromptPath = "system-prompt.md"   # Path to system prompt file (relative to config dir)
maxTurns = 50
skillPaths = ["../skills"]              # SKILL.md dirs (relative to this config's dir)
