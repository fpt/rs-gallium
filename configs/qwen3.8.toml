[llm]
# Qwen3.8-27B (dense, hybrid Gated DeltaNet + full attention; arch `qwen35`).
# Native vision-language model — the GGUF repo ships a working vision
# `mmproj` (no audio encoder; gallium refuses an audio turn against it).
# Architecture: docs/models/architectures.md. Tuning, measurements, the `refactoring`
# tool-call fix, the sampling choice and the template patch:
# docs/VERIFICATION_STATUS.md.
#
# gpuLayers 42 (of 65): full offload does not load on a 12GB card; 50 fails at
#   context creation. 42 keeps headroom for KV growth + a project's context.
# reasoningEffort "high": the template defaults thinking on at "xhigh", which
#   dominates every turn on a 27B with ~23 CPU layers; "high" → template
#   "medium" keeps the multi-step testcases passing and cuts short turns ~4x.
#   "xhigh" for the deepest reasoning; "low" turns thinking off.
# Q3_K_XL, not Q4: indistinguishable on the testsuite, ~10 more GPU layers.
# temperature/topP/topK: the model card's "Thinking Mode" sampling.
modelPath = "hf:unsloth/Qwen3.8-27B-GGUF/Qwen3.8-27B-UD-Q3_K_XL.gguf"
mmprojPath = "hf:unsloth/Qwen3.8-27B-GGUF/mmproj-F16.gguf"
gpuLayers = 42
reasoningEffort = "high"
temperature = 1.0
topP = 0.95
topK = 20
maxTokens = 4096

[agent]
systemPromptPath = "system-prompt.md"
maxTurns = 50
skillPaths = ["../skills"]
