[llm]
# Same model as gemma4-31b.toml — see that file for the general notes. This is
# the CUDA variant, tuned for a 12GB card specifically: at the default full
# offload (999 layers) the 17.3GB model fails to *load* rather than decode,
# since llama.cpp's CUDA allocator can't reserve the buffers up front.
#
# The bisected edge here was **not stable**: 28 completed a full round trip
# (load, create the context, generate) repeatedly at first, then started
# failing at context creation on identical repeat runs minutes later with
# nothing else holding VRAM (`nvidia-smi` back at idle between every attempt,
# no dmesg/XID errors) — same for 26 and 24 once retested. This looks like
# llama.cpp's CUDA buffer-size reservation being close enough to the card's
# limit that ordinary allocator variance decides it, not a number this repo
# can hand you with confidence at the edge. See issue #92, which is about
# exactly this: a hand-bisected number is fundamentally fragile near the
# limit, which argues for measuring a safety margin rather than the tightest
# value that once passed.
#
# 14 is what actually held across repeated runs (5/5, then 14 again 3/3) —
# real margin below the ~28 edge, not the edge itself. Room probably remains
# unclaimed above 14; re-bisect at your own risk, verify with *repeated* full
# generations (not a single load-then-generate), and prefer keeping a margin
# over chasing the exact top. A different card needs its own number —
# GALLIUM_GPU_LAYERS still overrides this file for that search.
#
# Do not copy `gpuLayers` back into gemma4-31b.toml: that file is shared by
# every backend, including Metal on Mac, where a card with more memory than
# 12GB would be capped for no reason.
modelPath = "hf:unsloth/gemma-4-31B-it-qat-GGUF/gemma-4-31B-it-qat-UD-Q4_K_XL.gguf"
tokenizerPath = "hf:unsloth/gemma-4-31B-it"
gpuLayers = 14
temperature = 0.7
maxTokens = 4096

[agent]
# Gemma 4 does support a system role, and its template declares tools natively
# (`<|tool>` / `<|tool_call>`), which llm_local.rs renders and parses. See
# docs/GEMMA4.md.
#
# Gemma 4 is capable but not self-directed: with the shared prompt it answers
# "tell me the status of this repo" by asking which repository is meant. This
# prompt tells it where it is and to look before asking. See the file's header.
systemPromptPath = "gemma4-system-prompt.md"
maxTurns = 50
skillPaths = ["../skills"]              # SKILL.md dirs (relative to this config's dir)

[[mcpServers]]
command = "godevmcp"
args = ["serve"]
