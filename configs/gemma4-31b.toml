[llm]
# Gemma 4 31B (dense — every parameter active per token, unlike the 26B-A4B
# MoE; the pair exists to compare a dense model against a same-generation MoE
# at similar total size). QAT release, one GGUF (UD-Q4_K_XL, 17.3GB).
# Prompt format: docs/GEMMA4.md. Tuning: docs/VERIFICATION_STATUS.md.
#
# gpuLayers 14: full offload does not load the 17.3GB model on a 12GB card;
#   the edge is unstable near the limit (issue #92), 14 held across repeats.
#   A 24GB M3 fits far more — raise it, or GALLIUM_GPU_LAYERS overrides.
modelPath = "hf:unsloth/gemma-4-31B-it-qat-GGUF/gemma-4-31B-it-qat-UD-Q4_K_XL.gguf"
tokenizerPath = "hf:unsloth/gemma-4-31B-it"
gpuLayers = 14
temperature = 0.7
maxTokens = 4096

[agent]
systemPromptPath = "gemma4-system-prompt.md"
maxTurns = 50
skillPaths = ["../skills"]

[[mcpServers]]
command = "godevmcp"
args = ["serve"]
