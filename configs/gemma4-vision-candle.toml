# Gemma 4 E4B on the native candle engine, **with vision** — the safetensors
# multimodal checkpoint (`unsloth/gemma-4-E4B-it`), not the GGUF. This is the
# only config that exercises the candle image path (`gemma4_vision.rs` +
# `gemma4_image.rs`); `gemma4-candle.toml` runs the GGUF, which candle loads
# text-only. See docs/MULTIMODAL.md.
#
# `modelPath` is a bare `hf:ORG/REPO` — a safetensors repo, so `model.safetensors`
# (~8 GB bf16), `config.json`, and `tokenizer.json` are all fetched from it; no
# separate `tokenizerPath` is needed.
#
# **Device: CPU on a 12 GB card, Metal on the 24 GB M3.** The safetensors
# `Gemma4::load` keeps E4B's PLE table (`embed_tokens_per_layer`,
# `[262144, 42*256]` ≈ 5.6 GB f16) and `embed_tokens` (≈ 1.3 GB) on-device — the
# GGUF path got a host-resident-PLE fix (`gemma4-candle.toml`), this one has not
# — so the RTX 4070 OOMs. Run it `GALLIUM_DEVICE=cpu` there (measured on a
# 121 GB-RAM host: model loads, ~30 tok/s prefill, ~4 tok/s decode); the 24 GB
# M3 fits it on Metal.
[llm]
inferenceEngine = "candle"
modelPath = "hf:unsloth/gemma-4-E4B-it"
temperature = 0.7                        # matches gemma4-candle.toml; Gemma 4 loops under greedy decode
maxTokens = 4096

[agent]
systemPromptPath = "gemma4-system-prompt.md"
maxTurns = 50
skillPaths = ["../skills"]              # SKILL.md dirs (relative to this config's dir)
