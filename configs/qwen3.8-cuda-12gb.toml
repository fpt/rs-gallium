[llm]
# Same model as qwen3.8.toml — see that file for the general notes (arch,
# vision support, the reasoning-effort template default, the sampling choice).
# This is the CUDA variant, tuned for a 12GB card. Two settings do the tuning:
# how much of the model sits on the GPU (`gpuLayers`) and how hard it thinks
# (`reasoningEffort`). Both were re-measured 2026-08-30 on an RTX 4070.
#
# ── gpuLayers = 42 (of 65) ─────────────────────────────────────────────────
# Dense model, no cpuMoe escape hatch (that flag only helps a sparse MoE —
# see the long comment in `llm_local.rs` — this model has no experts to move
# off-GPU), so every layer counts toward the same VRAM budget and full
# offload (999, the default) fails to load.
#
# Re-bisected with the projector configured, `maxTokens = 4096`, three real
# `coding` generations per value (issue #92: a single load-then-generate pass
# can't be trusted this close to the limit):
#   - 42: loads and runs 3/3; passes every runnable testcase (10/10, see
#     docs/VERIFICATION_STATUS.md).
#   - 44: also stable across coding ×2 + needle + refactoring + multimodal_image.
#   - 46: loads and runs, VRAM peak ~9.2 GB of 12 GB.
#   - 50: fails at context creation ("null reference from llama.cpp").
# 42 is chosen over 44/46 for headroom: a long conversation grows the KV
# cache and a real project adds its AGENTS.md / CLAUDE.md, neither of which
# the testsuite exercises.
#
# This is far above the previous value of 30. That number, and the earlier
# note that the projector forced it down from a text-only 40, predate flash
# attention being enabled in the vendored llama.cpp ("warmup: flash attention
# is enabled" at load) — with 4 KV heads that roughly halves the KV cache and
# is the most likely reason the ceiling moved up ~15 layers. Not re-bisected
# against the old llama.cpp rev; if the vendored copy changes, re-bisect.
#
# A different card, `maxTokens`, projector, or system prompt needs its own
# number; `GALLIUM_GPU_LAYERS` overrides this file for that search. Do not
# copy it into qwen3.8.toml — that file is shared with Metal on Mac, where a
# larger card would be capped for no reason.
#
# ── reasoningEffort = "high" ───────────────────────────────────────────────
# This family's template turns thinking on by default and, when it is on,
# defaults `reasoning_effort` to "xhigh" (see qwen3.8.toml). On a 27B with
# ~23 layers still on the CPU, xhigh's reasoning budget dominates every turn:
# measured 2026-08-30, the one-line `capital` turn took 41 s at the xhigh
# default against 10 s at "high". gallium's "high" maps to the template's
# `medium` effort (profile::Qwen3::reasoning_params) — enough scratchpad that
# all the multi-step agent testcases still pass, without xhigh's tax on the
# short ones. Set "xhigh" back here for a task that needs the deepest
# reasoning and can wait for it; "low" turns thinking off entirely.
#
# ── Q3 vs Q4 ──────────────────────────────────────────────────────────────
# UD-Q3_K_XL (12.2 GB), not UD-Q4_K_XL (16.4 GB). Measured 2026-08-30: at
# their respective GPU-layer ceilings (Q3 ~46, Q4 ~36) the two are
# indistinguishable on the testsuite — 10/10 runnable each — and within noise
# on wall time. Q3 keeps ~10 more layers on the GPU for the same card, so it
# is the pick here. qwen3.8.toml stays on Q4 for machines that fit it whole.
modelPath = "hf:unsloth/Qwen3.8-27B-GGUF/Qwen3.8-27B-UD-Q3_K_XL.gguf"
mmprojPath = "hf:unsloth/Qwen3.8-27B-GGUF/mmproj-F16.gguf"
gpuLayers = 42
reasoningEffort = "high"
# temperature/topP/topK: this model card's "Thinking Mode" sampling, same as
# qwen3.8.toml — see its comment for the min_p / presence_penalty gap.
temperature = 1.0
topP = 0.95
topK = 20
maxTokens = 4096

[agent]
systemPromptPath = "system-prompt.md"   # Path to system prompt file (relative to config dir)
maxTurns = 50
skillPaths = ["../skills"]              # SKILL.md dirs (relative to this config's dir)
