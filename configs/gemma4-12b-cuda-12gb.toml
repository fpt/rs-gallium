[llm]
# Same model as gemma4-12b.toml — see that file for the general notes. This is
# the CUDA variant, tuned for a 12GB card specifically.
#
# At the default full offload (999 layers) `gallium app-server` /
# `configs/gemma4-12b.toml` dies at the first turn with
#   Network error: Failed to create context: null reference from llama.cpp
# — `llama_new_context_with_model` returns NULL because the CUDA allocator
# cannot reserve the buffers up front. The 6.7GB Q4_K_XL weights fit on their
# own, but *plus* the vision + audio CLIP contexts (mmproj below, also on the
# GPU) *plus* an 8192-token context whose batch is sized to `n_ctx` (see
# CLAUDE.md's KV cache reuse notes) is over the ~11.9GB the card reports.
#
# Measured 2026-08-30 on an RTX 4070 (11902 MiB), text-only turn, this file's
# system prompt + skill catalog + tool schemas:
#   gpuLayers  outcome                 peak VRAM
#   999 / 40   fails at context init   —
#   30         held (2/2 full gens)    10847 MiB   (~1GB free — too close)
#   26         held                     9473 MiB
#   24         held                     8947 MiB   (~3GB free) ← shipped
#   20         held                     —
#
# 24 is a margin below a moving edge, not the tightest value that once passed
# — see issue #92 on why a hand-bisected number is fragile near the limit.
# Re-bisect at your own risk and verify with *repeated* full generations, not
# a single load-then-generate. A different card, `maxTokens`, or system prompt
# needs its own number — GALLIUM_GPU_LAYERS still overrides this file.
#
# Do not copy `gpuLayers` back into gemma4-12b.toml: that file is shared by
# every backend, including Metal on Mac, where a card with more memory than
# 12GB would be capped for no reason.
modelPath = "hf:unsloth/gemma-4-12B-it-qat-GGUF/gemma-4-12B-it-qat-UD-Q4_K_XL.gguf"
tokenizerPath = "hf:unsloth/gemma-4-12b-it"
# Vision + audio (llama.cpp backend only). Encoder-free projector, 167 MB on
# disk; it follows the model's offload decision, so it draws on the GPU too and
# is part of the budget the layer count above was measured against.
mmprojPath = "hf:unsloth/gemma-4-12B-it-qat-GGUF/mmproj-BF16.gguf"
gpuLayers = 24
temperature = 0.7
maxTokens = 4096
# reasoningEffort = "medium" (→ `enable_thinking = true`): measured 2026-08-29,
# this dense 12B uses Gemma 4's thought channel to plan multi-step work —
# `data_analysis` 0/6 → 6/6 and `spec_discovery` fail → pass with the flag.
# See gemma4-12b.toml and docs/VERIFICATION_STATUS.md.
reasoningEffort = "medium"

[agent]
# Gemma 4 does support a system role, and its template declares tools natively
# (`<|tool>` / `<|tool_call>`), which llm_local.rs renders and parses. See
# docs/GEMMA4.md.
#
# Gemma 4 is capable but not self-directed: with the shared prompt it answers
# "tell me the status of this repo" by asking which repository is meant. This
# prompt tells it where it is and to look before asking. See the file's header.
systemPromptPath = "gemma4-system-prompt.md"
maxTurns = 50
skillPaths = ["../skills"]              # SKILL.md dirs (relative to this config's dir)
