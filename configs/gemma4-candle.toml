# Gemma 4 E4B on the **native candle engine** — the same model and the same
# GGUF as `gemma4.toml`, which runs it through llama.cpp instead. The pair is
# the point: a difference between the two results is a difference between the
# engines, not between models. See `lfm2-candle.toml` for the same idea
# applied to LFM2.5.
#
# This config exists because ADR 0003 (docs/adr/0003-model-profiles.md, step
# 3-b) recorded Gemma 4 E4B as OOM-killed on candle on the machine that ADR
# was written against (24GB RAM, exit 137). That is a property of *that*
# machine, not of the model or the engine: on a 121GB-RAM host this loads and
# runs to completion on CPU (measured: ~12 tok/s prefill, ~5 tok/s decode on a
# 2088-token prompt) — check `free -h` before trusting either number
# elsewhere.
#
# No mmprojPath: the native candle backend has no multimodal path
# (`gemma4_vision.rs` compiles and is exported but nothing calls it — see
# CLAUDE.md's Multimodal input section). multimodal_image/multimodal_audio
# testcases are skipped for this backend the same way they are for any
# text-only one.
#
# CUDA acceleration exists for the candle backend now (`gallium-agent`'s
# `cuda` cargo feature reaches candle via `gallium-core?/cuda`, mirroring how
# Metal is wired for macOS) — build with `make build CARGO_FEATURES=cuda`.
# Without that feature this still runs on CPU regardless of GALLIUM_DEVICE,
# same as before.
#
# On this 12GB card, GALLIUM_DEVICE=cuda for THIS model fails load with
# CUDA_ERROR_OUT_OF_MEMORY, measured — not a CUDA-support bug (see
# lfm2-candle.toml for a model that loads and runs fine on the same build and
# the same card). `Gemma4Q::load` (gemma4_q.rs) eagerly dequantizes both
# `token_embd.weight` (671,088,640 elements) and E4B's PLE table
# `per_layer_token_embd.weight` (2,818,572,288 elements) straight to F32 on
# the target device before any transformer block loads. The PLE tensor alone
# is ~10.5 GiB; together with token_embd's ~2.5 GiB that's ~13 GiB of
# embedding tables before the rest of the ~5GB quantized model — more than an
# entire 12GB card, independent of any other allocation. This is inherent to
# candle_core's own eager quantized-dequantize-on-load path (not gallium-core's
# lazy `QVarBuilder`/`QExperts`), so a lower `maxTokens` or smaller context
# can't route around it; only a bigger card, or a from-scratch lazy/CPU-resident
# PLE lookup in gemma4_q.rs, would. GALLIUM_DEVICE=cpu is unaffected — see the
# comment above for that measurement.
[llm]
inferenceEngine = "candle"
modelPath = "hf:unsloth/gemma-4-E4B-it-GGUF/gemma-4-E4B-it-Q4_K_M.gguf"
# Only the candle engine reads this: it needs a tokenizer.json, which this
# GGUF repo omits. (llama.cpp uses the tokenizer inside the GGUF instead —
# see gemma4.toml.)
tokenizerPath = "hf:unsloth/gemma-4-E4B-it"
temperature = 0.7
maxTokens = 4096

[agent]
systemPromptPath = "gemma4-system-prompt.md"
maxTurns = 50
skillPaths = ["../skills"]              # SKILL.md dirs (relative to this config's dir)
