# Local DeepSeek-V4-Flash (in-process llama.cpp). 284B total, 13B active
# (MoE, 256 routed experts + 1 shared, top-6 routing). GGUF's own
# `general.architecture` is "deepseek4", which needs llama-cpp-2 >= 0.1.154
# (LLM_ARCH_DEEPSEEK4) — see #96 and the model-viability skill for how that
# was found; this repo's Cargo.toml is pinned there or later as of this file.
#
# UD-IQ3_XXS (103GB, 4-shard split — modelPath names shard 1 only,
# model_downloader.rs fetches the rest) over the smaller 1-bit quants: with
# cpuMoe (below), the file is mmap'd and paged in on demand as CPU threads
# route through experts, so staying resident in page cache rather than
# thrashing against disk matters — 103GB leaves ~15GB of slack against this
# machine's 118GB available RAM (`free -h`); the next quant up (UD-IQ3_S,
# 117.3GB) would nearly saturate it. 1-bit → 3-bit is also a large jump in a
# quant ladder, which matters here: UD-IQ1_S (82.5GB, the quant this config
# used before the first swap, to UD-Q2_K_XL, then to this one) showed
# temperature-sensitive tool-call reliability (see below) that a 1-bit
# quant's flatter/noisier logits plausibly explain. Full testsuite verified
# at this quant, greedy: 7/7 (2 multimodal skipped, no mmprojPath) —
# `make testsuite BACKENDS="deepseek-v4-flash"`. Every quant above
# UD-IQ3_XXS in this repo (UD-IQ3_S through UD-Q8_K_XL, 117GB-162GB) trades
# more disk and RAM for quality — re-check `df -h`/`free -h` before going
# further up the ladder, since the RAM margin above was specific to this
# machine's headroom at the time this config was written, not a property of
# the model.
#
# cpuMoe = true (MoE experts on CPU RAM, attention + KV cache stay on GPU —
# see docs/LLAMA_CPU_MOE.md): verified at UD-IQ3_XXS via the full testsuite
# pass above. Given the file is almost entirely expert weights (271B of the
# 284B total), this was expected to help a lot, the same shape as GPT-OSS
# 120B/Qwen 3.6/Gemma 4 — and it does, but the default (unset) gpuLayers used
# for that pass has not itself been bisected the way Gemma 4 26B-A4B's was
# (gemma4-26b-cuda-12gb.toml); it merely didn't fail. Bisect with *repeated*
# real generations before trusting a specific number here (issue #92) if
# this model's non-expert weights ever need their own gpuLayers search on a
# card as small as this repo's 12GB one. A quant swap changes every layer's
# byte size, so any gpuLayers number found for one quant does not carry over
# to another — re-bisect after switching quants, not just once.
#
# temperature = 0.0 (greedy), not this repo's usual 0.6-0.7: testsuite's
# file_read case was flaky at 0.6 against UD-IQ1_S — the model's DSML
# tool-call block (see `crate::profile::DeepSeekV4` /
# `crate::profile::wire::dsml`, and #116 for how DSML support was added) was
# emitted correctly some runs and replaced by a hallucinated markdown bash
# fence on others, with byte-identical output across repeats of each
# outcome (LlamaSampler::dist's seed is hardcoded to 1234, so a fixed prompt
# really does resample the same way — the divergence is in the *logits*,
# not the RNG draw). 4/4 failures at 0.6 vs. 3/3 passes at 0.0 on the same
# binary and prompt: a 1-bit quant of a 284B model has flat/noisy enough
# logits that non-greedy sampling can tip a razor-thin tool-call-vs-prose
# margin the wrong way. This config has since moved to UD-IQ3_XXS (see
# above), where greedy is confirmed still working (file_read passed in the
# full-testsuite run) — but temperature=0.6 has **not** been re-tried at
# this quant, so the flakiness above is unconfirmed-fixed rather than
# disproven. Worth re-loosening only after someone actually re-tests
# temperature at this quant, not as a leftover to casually loosen back up.
[llm]
modelPath = "hf:unsloth/DeepSeek-V4-Flash-GGUF/UD-IQ3_XXS/DeepSeek-V4-Flash-UD-IQ3_XXS-00001-of-00004.gguf"
cpuMoe = true
temperature = 0.0
maxTokens = 4096

[agent]
systemPromptPath = "system-prompt.md"   # Path to system prompt file (relative to config dir)
maxTurns = 50
skillPaths = ["../skills"]              # SKILL.md dirs (relative to this config's dir)

[[mcpServers]]
command = "godevmcp"
args = ["serve"]
