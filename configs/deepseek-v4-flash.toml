# Local DeepSeek-V4-Flash (in-process llama.cpp). 284B total, 13B active
# (MoE, 256 routed experts + 1 shared, top-6 routing). GGUF's own
# `general.architecture` is "deepseek4", which needs llama-cpp-2 >= 0.1.154
# (LLM_ARCH_DEEPSEEK4) — see #96 and the model-viability skill for how that
# was found; this repo's Cargo.toml is pinned there or later as of this file.
#
# Points at unsloth's `-0731-GGUF` repo, the **official** DeepSeek-V4-Flash
# release. This config used to point at a preview checkpoint
# (`unsloth/DeepSeek-V4-Flash-GGUF`, no `-0731` suffix); that checkpoint has
# been retired now that the official release is out and verified working —
# see git history for `deepseek-v4-flash-0731.toml`, which this file folds
# back into its normal name, if the preview's own behavior is ever needed
# for comparison again.
#
# This repo does **not** use the `dspark-*.gguf` drafter this HF repo also
# ships (10.9GB, "up to 2x faster decoding" per the model card) — gallium has
# no speculative-decoding support on either backend (`llm_local.rs` has no
# such plumbing), so it would be dead weight even if downloaded. Only
# `modelPath` below is fetched.
#
# UD-IQ3_XXS (measured 98GB on disk across the 4 shards — modelPath names
# shard 1 only, model_downloader.rs fetches the rest) over the smaller 1-bit
# quants: with cpuMoe (below), the file is mmap'd and paged in on demand as
# CPU threads route through experts, so staying resident in page cache rather
# than thrashing against disk matters — 98GB leaves ~20GB of slack against
# this machine's 118GB available RAM (`free -h`); the next quant up
# (UD-IQ3_S) would leave less room. 1-bit → 3-bit is also a large jump in a
# quant ladder — the preview checkpoint's UD-IQ1_S showed temperature-sensitive
# tool-call reliability that a 1-bit quant's flatter/noisier logits plausibly
# explained, carried forward here as the reason to start at UD-IQ3_XXS rather
# than re-litigate the ladder, not as a measurement of this checkpoint. Every
# quant above UD-IQ3_XXS in this repo (UD-IQ3_S through UD-Q8_K_XL, plus
# UD-Q2_K_XL/UD-Q3_K_M/UD-Q3_K_XL below it) trades more disk and RAM for
# quality — re-check `df -h`/`free -h` before going further up the ladder,
# since the RAM margin above is specific to this machine's headroom at the
# time this config was written, not a property of the model.
#
# cpuMoe = true (MoE experts on CPU RAM, attention + KV cache stay on GPU —
# see docs/LLAMA_CPU_MOE.md): verified via the full testsuite run below.
# Given the file is almost entirely expert weights (271B of the 284B total),
# this was expected to help a lot, the same shape as GPT-OSS 120B/Gemma 4/
# MiniMax-M2.7 — and it does; the model loads and runs on this repo's 12GB
# card. The default (unset) gpuLayers has not been bisected the way Gemma 4
# 26B-A4B's was (gemma4-26b-cuda-12gb.toml); it merely didn't fail during
# verification. Bisect with *repeated* real generations before trusting a
# specific number here (issue #92) if this model's non-expert weights ever
# need their own gpuLayers search on a card as small as this repo's 12GB one.
#
# temperature = 1.0, topP = 0.95 — the sampling this HF repo's own model card
# recommends, not this repo's usual 0.6-0.7 greedy-or-near-greedy choices.
# Greedy (temperature = 0.0, this config's original setting, inherited from
# the retired preview checkpoint) failed `refactoring` deterministically: the
# model announced intent ("I'll start by reading the file...") and then
# stopped — the raw generated text was literally that sentence, `</think>`,
# then the identical sentence again, with no DSML tool-call block ever
# emitted (byte-identical across repeats, LlamaSampler::dist's seed is
# hardcoded to 1234). Not a wire-layer or prompt bug —
# `crate::profile::wire::think::strip_think_blocks`'s opener-less-`</think>`
# handling did exactly what it's documented to do; there was simply no tool
# call in the model's output for it to find.
#
# temperature = 1.0 alone (still no topP — gallium had no such sampler stage
# until #136 added one) changed the failure rather than fixing it: the model
# did attempt a call, but in an XML-ish shape the DeepSeek profile doesn't
# parse (`<Read><file_path>...</file_path></Read>` instead of the DSML
# format `parse_native_tool_calls` looks for). Only the full recommended
# pair, temperature=1.0 *with* topP=0.95, actually fixed it — confirmed via
# `make testsuite BACKENDS="deepseek-v4-flash"`: **7/7** (2 multimodal
# skipped, no mmprojPath), with `refactoring`'s `counter.go` verified as
# genuinely rewritten by a real `Edit` tool call (not narrated text) and
# `check.sh` passing. This is checkpoint-specific rather than a broadly safe
# default: the retired preview checkpoint was already 7/7 at greedy, and the
# same temperature=1.0/topP=0.95 pair regressed *it* to 6/7 with this same
# failure mode — worth remembering if this repo ever points at a different
# DeepSeek-V4-Flash checkpoint again.
[llm]
modelPath = "hf:unsloth/DeepSeek-V4-Flash-0731-GGUF/UD-IQ3_XXS/DeepSeek-V4-Flash-0731-UD-IQ3_XXS-00001-of-00004.gguf"
cpuMoe = true
temperature = 1.0
topP = 0.95
maxTokens = 4096

[agent]
systemPromptPath = "system-prompt.md"   # Path to system prompt file (relative to config dir)
maxTurns = 50
skillPaths = ["../skills"]              # SKILL.md dirs (relative to this config's dir)

[[mcpServers]]
command = "godevmcp"
args = ["serve"]
