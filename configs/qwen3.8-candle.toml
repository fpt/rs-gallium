# Qwen3.8-27B on the **native candle engine** — the counterpart of
# `qwen3.8.toml`, which runs the same model through in-process llama.cpp.
#
# GGUF path, `qwen35_q.rs`. 13.4 GB of weights on a 12 GB card: what does not
# fit streams through the VRAM ledger's elastic cache — see
# docs/CANDLE_BACKEND.md, "Device memory" (issue #343).
[llm]
inferenceEngine = "candle"
modelPath = "hf:bartowski/Qwen3.8-27B-GGUF/Qwen3.8-27B-Q3_K_M.gguf"   # no IQ types, which candle cannot read — see docs/VERIFICATION_STATUS.md (#290)
tokenizerPath = "hf:Qwen/Qwen3.8-27B"   # the GGUF repo ships no tokenizer.json
reasoningEffort = "high"
temperature = 1.0
topP = 0.95
topK = 20
maxTokens = 4096

[agent]
maxTurns = 50
