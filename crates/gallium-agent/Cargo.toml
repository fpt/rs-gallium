[package]
name = "gallium-agent"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "gallium_agent"
path = "src/lib.rs"

[[bin]]
name = "gallium"
path = "src/main.rs"

[features]
# The native candle backend is gallium-agent's reason to exist, so it is on by
# default. The in-process llama.cpp backend (`local`) is on by default too.
# Both names say which engine they pull in, not which crate they live in —
# llama.cpp and candle are equally "gallium".
default = ["candle", "local"]
candle = ["dep:gallium-core", "dep:gallium-models", "dep:candle-core", "dep:tokenizers"]
local = ["dep:llama-cpp-2", "dep:minijinja", "dep:minijinja-contrib"]
# Explicit GPU backends for the in-process llama.cpp (each implies `local`).
# Metal is already on by default for macOS builds via the per-target llama-cpp-2
# dependency below, so `metal` here is only needed to state it explicitly; cuda
# and vulkan are the real opt-ins.
cuda = ["local", "llama-cpp-2/cuda"]
metal = ["local", "llama-cpp-2/metal"]
vulkan = ["local", "llama-cpp-2/vulkan"]

[dependencies]
# Concurrency
crossbeam = "0.8"
parking_lot.workspace = true

# HTTP client (blocking) + TLS
ureq = { version = "2.10", features = ["json", "native-tls"] }
native-tls = "0.2"

# HTTP server (sync) — used by the MCP HTTP server + app-server transports
tiny_http = "0.12"

# Serialization / errors / logging
serde.workspace = true
serde_json.workspace = true
toml = "0.8"
anyhow.workspace = true
thiserror = "1"
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Misc
glob = "0.3"
regex = "1"
encoding_rs = "0.8"
# Image attachments: bytes off disk become the base64 an LLM request carries.
base64 = "0.22"
# SIGINT for the REPL, so Ctrl-C cancels the running turn instead of killing the
# process. Chosen over signal_hook because it also covers Windows
# (SetConsoleCtrlHandler), which we ship binaries for, and one signal is all the
# REPL needs.
ctrlc = "3.5"

# In-process llama.cpp backend (optional; `local` feature). Renders the GGUF's
# embedded jinja chat template with minijinja. The llama-cpp-2 dependency itself
# is declared per-target below so macOS gets Metal automatically. `json` pulls in
# minijinja's `tojson` filter (backed by serde_json, already a workspace dep) —
# without it, any template that calls `|tojson` (e.g. MiniMax-M2.7's native
# tool-call protocol) fails to render with "unknown filter", silently falling
# back to the generic JSON-prose tool-call protocol instead.
minijinja = { version = "2", optional = true, features = ["loop_controls", "json"] }
minijinja-contrib = { version = "2", optional = true, features = ["pycompat"] }

# Native candle (gallium) backend (optional; `gallium` feature, on by default).
gallium-core = { workspace = true, optional = true }
gallium-models = { workspace = true, optional = true }
candle-core = { workspace = true, optional = true }
tokenizers = { workspace = true, optional = true }

# llama.cpp, declared per-target so the GPU backend matches what the platform can
# actually guarantee.
#
# macOS gets Metal by default: it ships with the OS, needs no extra SDK, and the
# Xcode command line tools this C++ build already requires are enough. Cap the
# offload with GALLIUM_GPU_LAYERS (0 = CPU) if a model exceeds the GPU working set.
#
# CUDA and Vulkan stay opt-in (`--features cuda` / `vulkan`) and are deliberately
# NOT defaulted anywhere: they depend on host hardware and toolkits (an NVIDIA GPU
# plus nvcc; the Vulkan SDK and drivers) that `cfg(target_os = ...)` cannot detect,
# so defaulting them would break the build on machines that lack them rather than
# fall back to CPU.
#
# `mtmd` is llama.cpp's multimodal front end: it turns image and audio files into
# embedding chunks using a projector (`mmproj-*.gguf`) loaded beside the model.
# On unconditionally rather than behind a gallium feature, because the cost is
# build time only — an `MtmdContext` is created solely when `mmprojPath` names a
# projector, so a text-only run allocates nothing and behaves exactly as before.
# It also brings in stb_image and miniaudio, which is what lets a `.png` or a
# `.wav` be handed over as raw bytes without gallium decoding either format.
[target.'cfg(target_os = "macos")'.dependencies]
llama-cpp-2 = { version = "0.1.154", optional = true, default-features = false, features = ["common", "metal", "mtmd"] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
llama-cpp-2 = { version = "0.1.154", optional = true, default-features = false, features = ["common", "mtmd"] }

# Process-group kill for the `bash` tool: std can kill a child, but not the
# descendants a shell forks, and there is no portable API for that.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
